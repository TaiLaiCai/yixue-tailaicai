<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 · Logo 八卦动画 Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#09090f;color:#dde0f0;
  font-family:-apple-system,"Helvetica Neue","PingFang SC","Hiragino Sans GB",sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:64px;
}

/* ── Logo char animation ── */
.logo-ch{display:inline-block;transition:color .12s,text-shadow .12s}
.logo-ch.yang{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.9),0 0 28px rgba(200,210,255,.5)}
.logo-ch.yin{color:rgba(20,20,35,.9);text-shadow:0 0 8px rgba(154,171,255,.4);-webkit-text-stroke:.5px rgba(154,171,255,.4)}

/* ── Demo layouts ── */
.section{text-align:center}
.label{font-size:.72rem;letter-spacing:.22em;color:#3e4062;margin-bottom:20px}

/* Header style */
.logo-header{
  font-size:1.15rem;font-weight:400;letter-spacing:.22em;color:#dde0f0;
  text-decoration:none;
}

/* Hero style */
.logo-hero{
  font-size:3rem;font-weight:200;letter-spacing:.38em;color:#dde0f0;
  text-indent:.38em;
}

/* Large style */
.logo-large{
  font-size:4.5rem;font-weight:100;letter-spacing:.5em;color:#dde0f0;
  text-indent:.5em;
}

/* Info card */
.info{
  background:rgba(255,255,255,.03);border:1px solid rgba(180,190,240,.07);
  border-radius:12px;padding:20px 28px;max-width:480px;
  font-size:.82rem;color:#7880a8;line-height:1.9;text-align:left;
}
.info strong{color:#dde0f0}
</style>
</head>
<body>

<div class="section">
  <div class="label">导航栏尺寸</div>
  <a class="logo-header" id="logo-header" href="#">易学泰来才</a>
</div>

<div class="section">
  <div class="label">开场屏尺寸</div>
  <div class="logo-hero" id="logo-hero">易学泰来才</div>
</div>

<div class="section">
  <div class="label">展示尺寸</div>
  <div class="logo-large" id="logo-large">易学泰来才</div>
</div>

<div class="info">
  <strong>工作原理：</strong><br>
  每个字符被包裹在 <code>&lt;span class="logo-ch"&gt;</code> 中，
  JS 定时随机选取字符，将内容临时替换为八卦符号（☰☷☱☳☲☵☴☶），
  并附加 <code>.yang</code>（白色高光）或 <code>.yin</code>（深色描边）CSS 类，
  200–380ms 后恢复原字。阳相/阴相交替，形成阴阳呼吸感。
</div>

<script>
(function(){
  const BAGUA = ['☰','☷','☱','☳','☲','☵','☴','☶'];
  const TEXT  = '易学泰来才';
  let yangPhase = true;

  function initLogo(el, delayStep){
    el.innerHTML = TEXT.split('').map((ch,i)=>
      `<span class="logo-ch" data-ch="${ch}" style="transition-delay:${i*delayStep}ms">${ch}</span>`
    ).join('');
  }

  function flash(el, dur1, dur2){
    const spans = el.querySelectorAll('.logo-ch');
    if(!spans.length) return;
    const sp  = spans[Math.floor(Math.random()*spans.length)];
    const sym = BAGUA[Math.floor(Math.random()*8)];
    const phase = yangPhase ? 'yang' : 'yin';
    yangPhase = !yangPhase;
    sp.textContent = sym;
    sp.classList.add(phase);
    setTimeout(()=>{ sp.textContent=sp.dataset.ch; sp.classList.remove('yang','yin'); },
      dur1 + Math.random()*dur2);
  }

  const header = document.getElementById('logo-header');
  const hero   = document.getElementById('logo-hero');
  const large  = document.getElementById('logo-large');

  initLogo(header, 18);
  initLogo(hero,   20);
  initLogo(large,  25);

  // Header: slow, 1 char
  setInterval(()=>{
    const n = Math.random()<.35 ? 2 : 1;
    for(let i=0;i<n;i++) setTimeout(()=>flash(header,200,180),i*140);
  }, 900 + Math.random()*400);

  // Hero: medium, 1-2 chars
  setInterval(()=>{
    const n = 1+Math.floor(Math.random()*2);
    for(let i=0;i<n;i++) setTimeout(()=>flash(hero,250,150),i*100);
  }, 500 + Math.random()*300);

  // Large: fast, 1-3 chars
  setInterval(()=>{
    const n = 1+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++) setTimeout(()=>flash(large,180,120),i*80);
  }, 400 + Math.random()*200);

})();
</script>
</body>
</html>
